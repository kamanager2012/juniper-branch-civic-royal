name: storybook product E2E

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Chromium desktop + mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
