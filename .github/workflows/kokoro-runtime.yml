name: kokoro locked narration runtime

on:
  pull_request:
    paths:
      - "scripts/kokoro_runtime.py"
      - "scripts/kokoro-runtime-smoke.py"
      - "scripts/kokoro-runtime-contract.test.py"
      - "scripts/kokoro-runtime-environment.mjs"
      - "scripts/kokoro-synthesize.py"
      - "scripts/narration-runtime/**"
      - ".github/workflows/kokoro-runtime.yml"
  push:
    branches: [main]
    paths:
      - "scripts/kokoro_runtime.py"
      - "scripts/kokoro-runtime-smoke.py"
      - "scripts/kokoro-runtime-contract.test.py"
      - "scripts/kokoro-runtime-environment.mjs"
      - "scripts/kokoro-synthesize.py"
      - "scripts/narration-runtime/**"
      - ".github/workflows/kokoro-runtime.yml"

permissions:
  contents: read

jobs:
  python312-linux-x64-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify committed runtime bytes
        run: node scripts/kokoro-runtime-environment.mjs
      - name: Compile runtime adapters
        run: |
          python -m py_compile scripts/kokoro_runtime.py scripts/kokoro-synthesize.py scripts/kokoro-runtime-smoke.py scripts/kokoro-runtime-contract.test.py
          python scripts/kokoro-runtime-contract.test.py
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Sync exact locked CPU runtime
        run: uv sync --locked --project scripts/narration-runtime
      - name: Checkout exact Kokoro inference source
        run: |
          mkdir -p .runtime-src/kokoro
          git -C .runtime-src/kokoro init
          git -C .runtime-src/kokoro remote add origin https://github.com/hexgrad/kokoro.git
          git -C .runtime-src/kokoro fetch --depth 1 origin dfb907a02bba8152ca444717ca5d78747ccb4bec
          git -C .runtime-src/kokoro checkout --detach FETCH_HEAD
          test "$(git -C .runtime-src/kokoro rev-parse HEAD)" = "dfb907a02bba8152ca444717ca5d78747ccb4bec"
          test -z "$(git -C .runtime-src/kokoro status --porcelain --untracked-files=all)"
      - name: Checkout exact Misaki Mandarin G2P source
        run: |
          mkdir -p .runtime-src/misaki
          git -C .runtime-src/misaki init
          git -C .runtime-src/misaki remote add origin https://github.com/hexgrad/misaki.git
          git -C .runtime-src/misaki fetch --depth 1 origin fba1236595f2d2bf21d414ba6e57d25256afada3
          git -C .runtime-src/misaki checkout --detach FETCH_HEAD
          test "$(git -C .runtime-src/misaki rev-parse HEAD)" = "fba1236595f2d2bf21d414ba6e57d25256afada3"
          test -z "$(git -C .runtime-src/misaki status --porcelain --untracked-files=all)"
      - name: Run locked Mandarin import and G2P smoke
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --locked --project scripts/narration-runtime python scripts/kokoro-runtime-smoke.py
          --kokoro-src-dir .runtime-src/kokoro
          --misaki-src-dir .runtime-src/misaki
