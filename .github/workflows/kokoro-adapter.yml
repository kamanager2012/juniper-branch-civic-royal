name: kokoro local narration adapter

on:
  pull_request:
    paths:
      - "scripts/kokoro-synthesize.py"
      - "scripts/kokoro-generation-contract.mjs"
      - "scripts/generate-narration.mjs"
      - ".github/workflows/kokoro-adapter.yml"
  push:
    branches: [main]
    paths:
      - "scripts/kokoro-synthesize.py"
      - "scripts/kokoro-generation-contract.mjs"
      - "scripts/generate-narration.mjs"
      - ".github/workflows/kokoro-adapter.yml"

permissions:
  contents: read

jobs:
  python-adapter-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile adapter without importing ML runtime
        run: python -m py_compile scripts/kokoro-synthesize.py
      - name: Verify CLI surface without model dependencies
        run: python scripts/kokoro-synthesize.py --help
