name: narration encoder fingerprint bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/narration-encoder-bootstrap.yml"

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install narration encoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Emit exact encoder and linked-library fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess

          def sh(*args):
              return subprocess.check_output(args, text=True).strip()

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def package_for(path):
              owner = sh('dpkg-query', '-S', path).split(':', 1)[0]
              version = sh('dpkg-query', '-W', '-f=${Version}', owner)
              return {'name': owner, 'version': version}

          def binary(name):
              path = sh('readlink', '-f', sh('which', name))
              return {
                  'name': name,
                  'path': path,
                  'sha256': sha256(path),
                  'package': package_for(path),
                  'versionLine': sh(name, '-version').splitlines()[0],
              }

          ldd = sh('ldd', '/usr/bin/ffmpeg').splitlines()
          wanted = ('libmp3lame.so', 'libavcodec.so', 'libavformat.so', 'libavutil.so', 'libswresample.so')
          libs = []
          for line in ldd:
              if not any(token in line for token in wanted):
                  continue
              match = re.search(r'=>\s+(\S+)', line)
              if not match:
                  continue
              path = os.path.realpath(match.group(1))
              libs.append({
                  'soname': line.strip().split()[0],
                  'path': path,
                  'sha256': sha256(path),
                  'package': package_for(path),
              })

          report = {
              'schemaVersion': 1,
              'runner': sh('lsb_release', '-ds'),
              'architecture': sh('dpkg', '--print-architecture'),
              'binaries': [binary('ffmpeg'), binary('ffprobe')],
              'libraries': sorted(libs, key=lambda x: x['soname']),
              'encodersLine': next(line.strip() for line in sh('ffmpeg', '-hide_banner', '-encoders').splitlines() if 'libmp3lame' in line),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          with open('/tmp/narration-encoder-fingerprint.json', 'w') as f:
              json.dump(report, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narration-encoder-fingerprint
          path: /tmp/narration-encoder-fingerprint.json
          retention-days: 1
