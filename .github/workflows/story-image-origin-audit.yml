name: story image origin audit

on:
  pull_request:
    paths:
      - "scripts/story-image-origin-audit.mjs"
      - ".github/workflows/story-image-origin-audit.yml"
      - "public/stories/**"
      - "content/evidence/story-images/**"

permissions:
  contents: read

jobs:
  imagine-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Show image audit runtime
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick -version | head -n 1
          elif command -v convert >/dev/null 2>&1; then
            convert -version | head -n 1
          elif command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "No supported JPEG decoder is available" >&2
            exit 1
          fi
      - name: Match release story images to historical Imagine artifacts
        run: node scripts/story-image-origin-audit.mjs --output=/tmp/story-image-origin-audit.json
