name: lockfile refresh

on:
  push:
    branches:
      - chore/storybook-remove-unused-animation-dep

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/storybook-remove-unused-animation-dep
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify reproducible install
        run: npm ci
      - name: Verify project gates
        run: npm run check
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile after dependency cleanup"
          git push origin HEAD:chore/storybook-remove-unused-animation-dep
